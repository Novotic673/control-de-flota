# Entorno local / servidor propio: PostgreSQL + MinIO (S3) + app
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: fleet, POSTGRES_PASSWORD: fleet, POSTGRES_DB: fleet }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: fleet, MINIO_ROOT_PASSWORD: fleetfleet }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  app:
    build: .
    profiles: ["app"]   # docker compose --profile app up -d
    depends_on: [db]
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fleet:fleet@db:5432/fleet
volumes: { pgdata: {}, minio: {} }
